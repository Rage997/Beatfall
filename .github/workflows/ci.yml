name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust and audio smoke dependencies
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pulseaudio pulseaudio-utils
      - run: cargo +stable fmt --check
      - run: cargo +stable check --locked
      - run: cargo +stable clippy --all-targets --locked -- -D warnings
      - run: cargo +stable test --locked
      - run: cargo +stable build --release --locked
      - name: Exercise the terminal, stdin, and real PulseAudio capture
        run: python3 scripts/smoke.py --binary target/release/cava-with-ball --pulse
      - name: Verify source package
        run: cargo +stable package --locked

  msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.85.0 --profile minimal
      - run: cargo +1.85.0 check --locked
      - run: cargo +1.85.0 test --locked
